# Trivy secret-scanner configuration for scans of this repository.
#
# Allow-rules suppress *secret* findings at specific paths where the secret is
# intentional (test fixtures, gitignored local dev creds, scaffolding templates).
# They do NOT disable vuln or misconfig scanning at those paths.
#
# Path values are regexes matched against the file path relative to the scan
# target (e.g. `docker/federation/ssl/alpha.federation.local.key`).
#
# When adding entries here, document *why* the secret is intentional so a
# future reader doesn't blindly extend the list.
#
# This file is canonical for both scanners that use it:
#   - .github/workflows/health.weekly.yaml (scheduled CI scan)
#   - the /trivy-scan command in the sibling pavillion-security repo
allow-rules:
  - id: pavillion-federation-ssl
    description: >-
      Intentional self-signed TLS certs/keys for the federation integration
      environment (alpha.federation.local / beta.federation.local). Generated
      by docker/federation/ssl/generate-certs.sh (the only tracked file in that
      directory) for docker-compose.federation.yml. The certs themselves are
      generated at test time and never committed; this rule also covers the
      generator script, which may embed base64 blobs that trip generic secret
      heuristics. Not used in production.
    path: docker/federation/ssl/.*

  - id: pavillion-dev-secrets-dir
    description: >-
      Local-only dev secret files (secrets/*.txt) consumed by docker-compose.yml
      via the Docker secrets `_FILE` pattern. The directory contents are
      gitignored (only .gitkeep is tracked); values are dev-only.
    path: secrets/.*

  - id: pavillion-env-files
    description: >-
      .env (gitignored) and .env.example (placeholder template). Real values
      never land in version control; .env.example contains only example values.
    path: (^|/)\.env(\.example)?$
