name: Docs Build
on:
  workflow_call:

jobs:
  docs_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci

      # VitePress fails the build on dead links. deploy_docs.yaml runs only on
      # release, so without this a broken link surfaces only when a release
      # tries to publish the docs site.
      - name: Build VitePress site
        run: npm run docs:build
