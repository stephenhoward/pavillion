name: Docs Build
on:
  workflow_call:

jobs:
  docs_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci

      # VitePress fails the build on dead links. deploy_docs.yaml runs only on
      # release, so without this a broken link surfaces only when a release
      # tries to publish the docs site.
      - name: Build VitePress site
        run: npm run docs:build
