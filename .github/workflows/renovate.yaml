name: Renovate
on:
  schedule:
    # Sundays 18:00 UTC — first of the three weekly jobs; the health scan
    # follows at 19:00 and the coverage report at 20:00.
    - cron: '0 18 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ secrets.RENOVATE_TOKEN }}
