name: Lint
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm install

      # Each linter reports independently: one failure must not hide the others.
      - name: ESLint
        run: npm run lint:js
        if: ${{ !cancelled() }}

      - name: Stylelint
        run: npm run lint:style
        if: ${{ !cancelled() }}

      # Security regression guard: raw SQL must stay static (see scripts/check-raw-sql.ts).
      - name: Raw SQL guard
        run: npm run lint:sql
        if: ${{ !cancelled() }}

      # Theme guard: one dark declaration site, no colour $public-* (see scripts/check-theme-tokens.ts).
      - name: Theme token guard
        run: npm run lint:theme
        if: ${{ !cancelled() }}

      # Migration guard: no two migrations share a numeric prefix (see scripts/check-migration-prefixes.ts).
      # A pull_request checkout is the merge commit, so this sees both sides of the merge.
      - name: Migration prefix guard
        run: npm run lint:migrations
        if: ${{ !cancelled() }}

      # Open-PR guard: this PR may not add a migration prefix another open PR adds (see scripts/check-migration-open-prs.ts).
      - name: Migration prefix vs open PRs
        run: npm run lint:migrations:open-prs
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # Report-only duplication measurement (see .jscpd.json); never fails the job.
      - name: Duplication report
        run: npm run lint:dup
        if: ${{ !cancelled() }}
        continue-on-error: true

      - name: Upload duplication report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jscpd-report
          path: reports/jscpd/
          if-no-files-found: warn
          retention-days: 30
