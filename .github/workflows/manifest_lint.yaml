name: Manifest Lint
on:
  workflow_call:

jobs:
  manifest_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run bash tests
        run: bash bin/test/run.sh
      - name: Check manifest wiring
        run: bash bin/check-manifest.sh
