name: Run E2E Tests
on:
  workflow_call:
    inputs:
      platform:
        description: 'The platform to run the tests on'
        required: true
        type: string
      runner:
        description: 'The runner to run the tests on'
        required: true
        type: string
jobs:
  e2e:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm install
      - name: Build frontend assets
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Generate self-signed TLS certs for ICS rel-me HTTPS mock
        run: |
          chmod +x docker/federation/ssl/generate-certs.sh
          docker/federation/ssl/generate-certs.sh
      - run: npm run test:e2e
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      # The list reporter prints a line per test, so a skip shows in the log.
      - name: Run WebKit e2e
        run: npm run test:e2e:webkit -- --reporter=list
