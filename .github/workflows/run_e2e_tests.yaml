name: Run E2E Tests
on:
  workflow_call:
    inputs:
      platform:
        description: 'The platform to run the tests on'
        required: true
        type: string
      runner:
        description: 'The runner to run the tests on'
        required: true
        type: string
jobs:
  e2e:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm install
      - name: Build frontend assets
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Generate self-signed TLS certs for ICS rel-me HTTPS mock
        run: |
          chmod +x docker/federation/ssl/generate-certs.sh
          docker/federation/ssl/generate-certs.sh
      - run: npm run test:e2e
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      # The config's only reporter is html and this job uploads no artifact,
      # so without the list reporter a failure prints no test name or error.
      - name: Run WebKit e2e
        run: npm run test:e2e:webkit -- --reporter=list
